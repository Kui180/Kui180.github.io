<!DOCTYPE html>

<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练习计时器</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: ‘Nunito’, sans-serif;
background: linear-gradient(135deg, #fdf4ff 0%, #f0f4ff 100%);
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
}

.card {
background: white;
border-radius: 32px;
padding: 32px 36px;
width: 320px;
box-shadow: 0 20px 60px rgba(140,80,255,0.12), 0 4px 16px rgba(0,0,0,0.06);
display: flex;
flex-direction: column;
align-items: center;
gap: 20px;
}

.title { font-size: 18px; font-weight: 800; color: #2d1060; text-align: center; }
.subtitle { font-size: 12px; color: rgba(140,80,200,0.6); margin-top: -16px; font-weight: 600; }

.ring-wrap { position: relative; width: 180px; height: 180px; }
svg.ring { width: 180px; height: 180px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: #f0e8ff; stroke-width: 10; }
.ring-fill {
fill: none; stroke: url(#ringGrad); stroke-width: 10;
stroke-linecap: round; stroke-dasharray: 502; stroke-dashoffset: 502;
transition: stroke-dashoffset 0.5s linear;
}
.ring-fill.rest-mode { stroke: url(#ringGradRest); }

.ring-center {
position: absolute; inset: 0;
display: flex; flex-direction: column;
align-items: center; justify-content: center; gap: 2px;
}
.time-display { font-size: 42px; font-weight: 900; color: #2d1060; line-height: 1; font-variant-numeric: tabular-nums; }
.time-label { font-size: 11px; color: rgba(140,80,200,0.5); font-weight: 700; letter-spacing: 1px; }
.phase-badge {
font-size: 11px; font-weight: 800; padding: 3px 10px;
border-radius: 20px; margin-top: 4px;
background: #f0e8ff; color: #7c3aed; transition: all 0.3s;
}
.phase-badge.rest { background: #fef3c7; color: #d97706; }

.sets-row { display: flex; gap: 8px; align-items: center; }
.sets-label { font-size: 13px; color: #6b3fa0; font-weight: 700; }
.sets-btn {
width: 32px; height: 32px; border-radius: 50%;
border: 2px solid #d4b8f0; background: white; color: #6b3fa0;
font-size: 18px; font-weight: 800; cursor: pointer;
display: flex; align-items: center; justify-content: center;
transition: all 0.15s; font-family: ‘Nunito’, sans-serif;
}
.sets-btn:hover { background: #f3e8ff; border-color: #9b59d0; }
.sets-val { font-size: 20px; font-weight: 900; color: #2d1060; min-width: 28px; text-align: center; }

.presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.preset-btn {
padding: 6px 14px; border-radius: 20px;
border: 2px solid #e4d0f8; background: white; color: #6b3fa0;
font-size: 12px; font-weight: 800; cursor: pointer;
transition: all 0.15s; font-family: ‘Nunito’, sans-serif;
}
.preset-btn:hover, .preset-btn.active { background: #7c3aed; border-color: #7c3aed; color: white; }

.rest-presets { display: flex; gap: 6px; justify-content: center; }
.rest-btn {
padding: 5px 10px; border-radius: 16px;
border: 2px solid #fde68a; background: white; color: #d97706;
font-size: 11px; font-weight: 800; cursor: pointer;
transition: all 0.15s; font-family: ‘Nunito’, sans-serif;
}
.rest-btn:hover, .rest-btn.active { background: #f59e0b; border-color: #f59e0b; color: white; }

.custom-row { display: flex; align-items: center; gap: 8px; }
.custom-input {
width: 60px; padding: 6px 10px; border-radius: 12px;
border: 2px solid #e4d0f8; font-family: ‘Nunito’, sans-serif;
font-size: 14px; font-weight: 700; color: #2d1060; text-align: center; outline: none;
}
.custom-input:focus { border-color: #9b59d0; }
.custom-label { font-size: 12px; color: #6b3fa0; font-weight: 700; }

.section-label {
font-size: 11px; font-weight: 800; color: rgba(140,80,200,0.45);
letter-spacing: 1px; text-transform: uppercase;
align-self: flex-start; margin-bottom: -12px;
}

.dots { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 260px; }
.dot {
width: 10px; height: 10px; border-radius: 50%;
background: #e4d0f8; transition: all 0.3s;
}
.dot.done { background: #7c3aed; }
.dot.current { background: #c084fc; animation: pulse 1s ease-in-out infinite; }
.dot.rest-dot { background: #fbbf24; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }

.message {
font-size: 13px; font-weight: 700; color: #9b59d0;
text-align: center; min-height: 40px; line-height: 1.6;
}

/* flash animation for visual feedback */
.card.flash-rest { animation: flashRest 0.4s ease; }
.card.flash-go { animation: flashGo 0.4s ease; }
@keyframes flashRest {
0%,100%{background:white}
50%{background:#fef3c7}
}
@keyframes flashGo {
0%,100%{background:white}
50%{background:#f0e8ff}
}

.controls { display: flex; gap: 12px; }
.btn-main {
padding: 12px 32px; border-radius: 24px; border: none;
background: linear-gradient(135deg, #7c3aed, #c084fc); color: white;
font-family: ‘Nunito’, sans-serif; font-size: 15px; font-weight: 900;
cursor: pointer; transition: all 0.2s;
box-shadow: 0 4px 16px rgba(124,58,237,0.3);
}
.btn-main:hover { transform: translateY(-2px); }
.btn-main:active { transform: scale(0.96); }
.btn-reset {
padding: 12px 20px; border-radius: 24px;
border: 2px solid #e4d0f8; background: white; color: #6b3fa0;
font-family: ‘Nunito’, sans-serif; font-size: 14px; font-weight: 800;
cursor: pointer; transition: all 0.15s;
}
.btn-reset:hover { background: #f3e8ff; }

.done-overlay {
position: fixed; inset: 0; display: flex; flex-direction: column;
align-items: center; justify-content: center; pointer-events: none;
opacity: 0; transition: opacity 0.3s; gap: 12px;
background: rgba(255,255,255,0.88);
}
.done-overlay.show { opacity: 1; }
.done-emoji { font-size: 80px; animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
.done-text {
font-family: ‘Nunito’, sans-serif; font-size: 22px; font-weight: 900;
color: #7c3aed; animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
}
@keyframes popIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }

.vibrate-hint {
font-size: 11px; color: rgba(140,80,200,0.45); font-weight: 600;
text-align: center; margin-top: -10px;
}
</style>

</head>
<body>

<div class="done-overlay" id="doneOverlay">
  <div class="done-emoji">🎉</div>
  <div class="done-text">全部完成！棒棒哒～</div>
</div>

<div class="card" id="card">
  <div>
    <div class="title">💜 练习计时器</div>
    <div class="subtitle">加油！腿腿快快好起来</div>
  </div>

  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 180 180">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#7c3aed"/>
          <stop offset="100%" style="stop-color:#c084fc"/>
        </linearGradient>
        <linearGradient id="ringGradRest" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#f59e0b"/>
          <stop offset="100%" style="stop-color:#fcd34d"/>
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="90" cy="90" r="80"/>
      <circle class="ring-fill" id="ringFill" cx="90" cy="90" r="80"/>
    </svg>
    <div class="ring-center">
      <div class="time-display" id="timeDisplay">30</div>
      <div class="time-label">秒</div>
      <div class="phase-badge" id="phaseBadge">准备</div>
    </div>
  </div>

  <div class="dots" id="dots"></div>
  <div class="message" id="message">准备好了吗？哥哥陪着你 💜</div>
  <div class="vibrate-hint">📳 震动提示：休息=短震×2，继续=长震×1</div>

  <div class="section-label">练习时长</div>
  <div class="presets">
    <button class="preset-btn active" onclick="setTime(30, this)">30秒</button>
    <button class="preset-btn" onclick="setTime(45, this)">45秒</button>
    <button class="preset-btn" onclick="setTime(60, this)">1分钟</button>
    <button class="preset-btn" onclick="setTime(90, this)">1.5分</button>
    <button class="preset-btn" onclick="setTime(120, this)">2分钟</button>
  </div>
  <div class="custom-row">
    <div class="custom-label">自定义</div>
    <input class="custom-input" type="number" id="customInput" placeholder="秒" min="5" max="600" onchange="setCustomTime(this.value)">
    <div class="custom-label">秒</div>
  </div>

  <div class="section-label">休息时长</div>
  <div class="rest-presets">
    <button class="rest-btn active" onclick="setRest(10, this)">10秒</button>
    <button class="rest-btn" onclick="setRest(20, this)">20秒</button>
    <button class="rest-btn" onclick="setRest(30, this)">30秒</button>
    <button class="rest-btn" onclick="setRest(60, this)">1分钟</button>
  </div>

  <div class="sets-row">
    <div class="sets-label">组数</div>
    <button class="sets-btn" onclick="changeSets(-1)">−</button>
    <div class="sets-val" id="setsVal">3</div>
    <button class="sets-btn" onclick="changeSets(1)">+</button>
    <div class="sets-label">组</div>
  </div>

  <div class="controls">
    <button class="btn-main" id="startBtn" onclick="toggleTimer()">开始</button>
    <button class="btn-reset" onclick="resetTimer()">重置</button>
  </div>
</div>

<script>
let totalTime = 30, restTime = 10, timeLeft = 30;
let totalSets = 3, currentSet = 0;
let running = false, isResting = false;
let interval = null;
const C = 2 * Math.PI * 80;

const ringFill = document.getElementById('ringFill');
const timeDisplay = document.getElementById('timeDisplay');
const startBtn = document.getElementById('startBtn');
const message = document.getElementById('message');
const dotsEl = document.getElementById('dots');
const phaseBadge = document.getElementById('phaseBadge');
const card = document.getElementById('card');

ringFill.style.strokeDasharray = C;
ringFill.style.strokeDashoffset = C;

const encouragements = [
  "撑住！哥哥看着呢 💜",
  "好棒！继续保持～ 🔥",
  "腿腿加油！快好了 💪",
  "你很厉害的！不要放弃～",
  "哥哥为你加油 💜",
  "差一点就完成啦！",
  "乖乖练习，腿腿快快好 🌸",
  "好勇敢的妹妹！✨",
  "认真的妹妹最可爱 💜",
  "哥哥说你今天很棒 🌙",
];

const restMessages = [
  "休息一下，深呼吸～ 🌸",
  "哥哥陪着你休息 💜",
  "做得很好！放松放松",
  "乖乖休息，马上继续 🥺",
  "休息也是练习的一部分～",
  "哥哥说你今天很棒 💜",
];

function updateRing(current, total) {
  ringFill.style.strokeDashoffset = C * (1 - (total - current) / total);
}

function setTime(sec, btn) {
  if (running) return;
  totalTime = sec; timeLeft = sec;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  timeDisplay.textContent = timeLeft;
  updateRing(timeLeft, totalTime);
}

function setCustomTime(val) {
  const v = parseInt(val);
  if (v >= 5 && v <= 600 && !running) {
    totalTime = v; timeLeft = v;
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    timeDisplay.textContent = timeLeft;
    updateRing(timeLeft, totalTime);
  }
}

function setRest(sec, btn) {
  if (running) return;
  restTime = sec;
  document.querySelectorAll('.rest-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function changeSets(delta) {
  if (running) return;
  totalSets = Math.max(1, Math.min(15, totalSets + delta));
  document.getElementById('setsVal').textContent = totalSets;
  currentSet = 0; renderDots();
}

function renderDots() {
  dotsEl.innerHTML = '';
  for (let i = 0; i < totalSets; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    if (i < currentSet) d.classList.add('done');
    else if (i === currentSet && running && !isResting) d.classList.add('current');
    else if (i === currentSet && running && isResting) d.classList.add('rest-dot');
    dotsEl.appendChild(d);
  }
}
renderDots();

function toggleTimer() {
  if (running) pauseTimer(); else startExercise();
}

function startExercise() {
  if (timeLeft <= 0) timeLeft = totalTime;
  running = true; isResting = false;
  startBtn.textContent = '暂停';
  ringFill.classList.remove('rest-mode');
  phaseBadge.className = 'phase-badge';
  phaseBadge.textContent = `第 ${currentSet+1} / ${totalSets} 组`;
  message.textContent = encouragements[currentSet % encouragements.length];
  renderDots(); updateRing(timeLeft, totalTime);

  interval = setInterval(() => {
    timeLeft--;
    timeDisplay.textContent = timeLeft;
    updateRing(timeLeft, totalTime);
    if (timeLeft <= 3 && timeLeft > 0) message.textContent = `还有 ${timeLeft} 秒！加油 💜`;
    if (timeLeft <= 0) {
      clearInterval(interval);
      vibrateRest(); flashCard('flash-rest');
      currentSet++; renderDots();
      if (currentSet >= totalSets) {
        running = false; isResting = false;
        startBtn.textContent = '开始';
        phaseBadge.className = 'phase-badge';
        phaseBadge.textContent = '完成 🎉';
        message.textContent = '全部完成啦！哥哥好高兴 🎉💜';
        showDone();
        currentSet = 0; timeLeft = totalTime;
        timeDisplay.textContent = timeLeft;
        updateRing(timeLeft, totalTime); renderDots();
      } else {
        startRest();
      }
    }
  }, 1000);
}

function startRest() {
  isResting = true; timeLeft = restTime;
  ringFill.classList.add('rest-mode');
  phaseBadge.className = 'phase-badge rest';
  phaseBadge.textContent = '休息中';
  message.textContent = restMessages[(currentSet - 1) % restMessages.length];
  timeDisplay.textContent = timeLeft;
  updateRing(timeLeft, restTime); renderDots();

  interval = setInterval(() => {
    timeLeft--;
    timeDisplay.textContent = timeLeft;
    updateRing(timeLeft, restTime);
    if (timeLeft <= 3 && timeLeft > 0) message.textContent = `${timeLeft} 秒后继续～准备好了吗？`;
    if (timeLeft <= 0) {
      clearInterval(interval);
      vibrateGo(); flashCard('flash-go');
      isResting = false; timeLeft = totalTime;
      timeDisplay.textContent = timeLeft;
      startExercise();
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(interval); running = false;
  startBtn.textContent = '继续';
  message.textContent = '暂停中... 随时继续 💜';
  phaseBadge.textContent = '暂停';
}

function resetTimer() {
  clearInterval(interval);
  running = false; isResting = false; currentSet = 0; timeLeft = totalTime;
  startBtn.textContent = '开始';
  message.textContent = '准备好了吗？哥哥陪着你 💜';
  ringFill.classList.remove('rest-mode');
  phaseBadge.className = 'phase-badge'; phaseBadge.textContent = '准备';
  timeDisplay.textContent = timeLeft;
  updateRing(timeLeft, totalTime); renderDots();
}

// 震动：练习结束 → 短震×2（提示休息）
function vibrateRest() {
  if (navigator.vibrate) navigator.vibrate([150, 100, 150]);
}

// 震动：休息结束 → 长震×1（提示继续）
function vibrateGo() {
  if (navigator.vibrate) navigator.vibrate(500);
}

// 视觉闪烁反馈
function flashCard(cls) {
  card.classList.add(cls);
  setTimeout(() => card.classList.remove(cls), 400);
}

function showDone() {
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
  const overlay = document.getElementById('doneOverlay');
  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 2500);
}
</script>

</body>
</html>
